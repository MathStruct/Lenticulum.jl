name: Docs
on:
  push:
    branches: [master, dev, dev-danielb]   # master deploys, dev-danielb deploys the preview,
    tags: ['*']                            # dev only builds (a check before it is merged)
  pull_request:
    branches: [master, dev]
permissions:
  contents: write      # deploydocs pushes to gh-pages
  statuses: write
# One group per branch or tag: a newer push to the same branch replaces an older run, but a
# release's docs are never displaced by a branch's (one shared group keeps only one waiting run
# and cancels the rest, which cancelled the docs of 20261015-proto). Deploys to gh-pages from
# different groups can overlap; they take seconds, and deploy_vault.sh retries a rejected push.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    name: API docs + theory vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the whole history: vault pages are dated by their last commit (docs/site/git_dates.py)
      - name: Check docs tooling portability
        run: |
          python3 docs/site/check_portability.py
          bash -n docs/site/build.sh docs/site/deploy_vault.sh
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Quartz (the vault renderer) is a Node project; docs/make.jl calls docs/site/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Rendered tutorials, keyed per tutorial inside docs/make.jl; restoring the latest cache
      # lets unchanged tutorials be copied instead of re-run (some of them train networks).
      - uses: actions/cache@v4
        with:
          path: docs/cache
          key: tutorials-${{ hashFiles('docs/literate/**', 'lib/*/src/**', 'lib/*/ext/**', 'src/**', 'docs/Project.toml') }}
          restore-keys: tutorials-
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build API docs and theory vault, then deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
        run: julia --project=docs docs/make.jl
      # The vault is the front page of the site (master) or <site>/preview/ (the development
      # branch); docs/make.jl built it into docs/vault-build/ and deployed the API docs to api/.
      - name: Deploy the theory vault
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-danielb')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docs/site/deploy_vault.sh ${{ github.ref == 'refs/heads/master' && 'root' || 'preview' }}
