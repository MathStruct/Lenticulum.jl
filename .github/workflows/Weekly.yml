name: Weekly
# The packages off the three paths, not yet reviewed (vault/Project/Refactor 2026-11.md): ImplicitLayers,
# Adversarial, AlgebraicFactors. Not tested on every push: once a week, on demand (Actions → Weekly →
# Run workflow), and when their own files change. A change in
# the core can break them between two weekly runs; run the workflow before relying on one.
on:
  schedule:
    - cron: '0 4 * * 1'          # Mondays, 04:00 UTC
  workflow_dispatch:
  push:
    branches: [master, dev, dev-danielb]
    paths: ['lib/ImplicitLayers.jl/**', 'lib/Adversarial.jl/**', 'lib/AlgebraicFactors.jl/**', '.github/workflows/Weekly.yml']
jobs:
  weekly:
    name: ${{ matrix.package }} · weekly
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - lib/ImplicitLayers.jl
          - lib/Adversarial.jl
          - lib/AlgebraicFactors.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test ${{ matrix.package }}
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
