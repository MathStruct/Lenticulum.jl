name: CI
on:
  push:
    branches: [master, dev, dev-danielb, refactor]
  pull_request:
    branches: [master, dev]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: ${{ matrix.package }} · Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the current release, and 1.12, the oldest supported: `[sources]` (the packages' paths to each
        # other) needs 1.11, and on 1.11 the Enzyme backend of the DEQ solve fails (2026-11-05)
        julia: ['1', '1.12']
        package:
          - lib/LenticulumCore.jl
          - lib/Mycelium.jl
          - lib/MyceliumLearning.jl
          - lib/Lenticulum.jl
          - lib/VariationalDiffusion.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Test ${{ matrix.package }}
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  # The device (JLArrays) coverage of Mycelium and MyceliumLearning, which `test` skips. A separate job, so it runs beside the matrix rather than after it.
  device:
    name: ${{ matrix.package }} · device tests (JLArrays)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - lib/Mycelium.jl
          - lib/MyceliumLearning.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test ${{ matrix.package }} with the device files
        env:
          LENTICULUM_DEVICE_TESTS: 'true'
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  # The parked packages (vault/Project/Refactor 2026-11.md): not part of the core, but kept passing so
  # that each can come back. Current release only.
  parked:
    name: ${{ matrix.package }} · parked
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - parked/ImplicitLayers.jl
          - parked/Adversarial.jl
          - parked/AlgebraicFactors.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test ${{ matrix.package }}
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
